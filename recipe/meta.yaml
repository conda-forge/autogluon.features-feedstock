{% set name = "autogluon.features" %}
{% set version = "1.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/autogluon/autogluon/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 34f4569b87d60a60bbd73260c82ca5ed891cb76e7189cbf5ca865c6378af2eec

build:
  noarch: python
  script: {{ PYTHON }} -m pip install ./features -vv
  number: 0
  script_env:
    - RELEASE=1

requirements:
  host:
    - python {{ python_min }}
    - pip
  # see deps in https://github.com/autogluon/autogluon/blob/master/features/setup.py
  # version bounds defined in https://github.com/autogluon/autogluon/blob/master/core/src/autogluon/core/_setup_utils.py
  run:
    - accelerate >=1.1.0,<2.0
    - autogluon.core ==1.6.2.dev0
    - autogluon.features ==1.6.2.dev0
    - autogluon.tabular ==1.6.2.dev0
    - chronos-forecasting >=2.3.1,<2.4
    - coreforecast >=0.0.12,<0.0.17
    - einops >=0.7,<1
    - fugue >=0.9.0
    - gluonts >=0.17.0,<0.18.0
    - huggingface_hub >=1.3,<2.0
    - joblib >=1.2,<1.7
    - lightning >=2.5.1,<2.7
    - mlforecast >=0.14.0,<0.15.0
    - networkx >=3.0,<4
    - orjson >=3.9,<4.dev0
    - peft >=0.18.1,<0.20
    - pytorch >=2.10,<2.14
    - safetensors >=0.4,<1
    - scipy >=1.5.4,<1.19
    - statsforecast >=1.7.0,<2.1.2
    - tensorboard >=2.9,<3
    - tqdm >=4.38,<5
    - transformers >=5.3,<5.15
    - utilsforecast >=0.2.3,<0.2.12
    - python >={{ python_min }},<3.14
    - numpy >=1.25.0,<2.6.0
    - pandas >=2.0.0,<2.4.0
    - scikit-learn >=1.4.0,<1.10.0
    - autogluon.common ==1.6.2.dev0

test:
  imports:
    - autogluon.features
  commands:
    - python -c "from autogluon.features import __version__ as v; from packaging.version import parse; expected = '{{ version }}'; assert parse(v) == parse(expected), f'{v} != {expected}'"
  requires:
    - pip

about:
  home: https://pypi.org/project/autogluon.features/
  summary: AutoML for Image, Text, and Tabular Data
  description: |
    AutoGluon automates machine learning tasks enabling you to easily achieve strong
    predictive performance in your applications. With just a few lines of code, you
    can train and deploy high-accuracy machine learning and deep learning models on
    image, text, time series, and tabular data.
  dev_url: https://github.com/autogluon/autogluon/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - shchur
    - Innixma
    - prateekdesai04
